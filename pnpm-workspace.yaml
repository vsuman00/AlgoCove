packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# This workspace pins exact dependency versions and validates them with the
# frozen lockfile, dependency audit, and secret scan in CI. Keep installs
# deterministic for the repository's explicit latest-version policy rather
# than making CI wait for pnpm's one-day release cooldown.
minimumReleaseAge: 0

# pnpm 12 blocks lifecycle scripts by default. This native resolver is the
# only dependency that must run its postinstall step for the Next/Vite toolchain.
allowBuilds:
  unrs-resolver: true
