name: Execution image release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable image tag; defaults to the workflow commit"
        required: false
        type: string
  push:
    tags:
      - "execution-v*"

permissions: {}

concurrency:
  group: execution-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  admission:
    name: Admit exact CI revision
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require all quality and sandbox jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ops/release/preflight.ts --sha "$GITHUB_SHA"

  publish-and-sign:
    needs: admission
    name: Build, scan, and sign ${{ matrix.id }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/execution-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - id: python
            context: services/execution-images/python
          - id: javascript-typescript
            context: services/execution-images/javascript-typescript
          - id: java
            context: services/execution-images/java
          - id: c-cpp
            context: services/execution-images/c-cpp
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Resolve image reference
        id: image
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            if [[ "$GITHUB_REF" == refs/tags/execution-v* ]]; then
              tag="${GITHUB_REF_NAME#execution-}"
            else
              tag="sha-${GITHUB_SHA}"
            fi
          fi
          if [[ ! "$tag" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          printf 'name=ghcr.io/%s/algocove/execution-%s\n' "$owner" "${{ matrix.id }}" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push image with attestations
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          provenance: true
          sbom: true

      - name: Scan pushed image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scan-type: image
          format: table
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image by immutable digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify keyless signature identity and issuer
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/execution-release\\.yml@.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Record signed image evidence
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          {
            echo "### Signed execution image"
            echo "- Image: ${IMAGE}:${TAG}"
            echo "- Digest: ${IMAGE}@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write immutable profile receipt
        env:
          PROFILE_ID: ${{ matrix.id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p runtime-receipt
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`runtime-receipt/${process.env.PROFILE_ID}.json`, JSON.stringify({
            schemaVersion: 1, profileId: process.env.PROFILE_ID,
            sourceSha: process.env.GITHUB_SHA, sourceRunId: Number(process.env.GITHUB_RUN_ID),
            sourceWorkflowRef: process.env.GITHUB_WORKFLOW_REF,
            imageDigest: process.env.IMAGE_DIGEST,
          }) + '\n');
          NODE

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-receipt-${{ matrix.id }}
          path: runtime-receipt/*.json
          if-no-files-found: error
          retention-days: 30

  runtime-candidate:
    name: Assemble and sign runtime image set
    needs: [admission, publish-and-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: runtime-receipt-*
          path: runtime-receipts
          merge-multiple: true
      - name: Reverify exact-source images and assemble candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ops/release/assemble-runtime.ts runtime-receipts runtime-release.json
      - name: Sign and verify the complete manifest
        run: |
          cosign sign-blob --yes --bundle runtime-release.sigstore.json runtime-release.json
          cosign verify-blob runtime-release.json --bundle runtime-release.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: signed-runtime-release
          path: |
            runtime-release.json
            runtime-release.sigstore.json
          if-no-files-found: error
          retention-days: 30
