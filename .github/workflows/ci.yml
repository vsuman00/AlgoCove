name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository verification
        run: pnpm verify

      - name: Start PostgreSQL and pgvector
        run: docker compose up -d --wait db

      - name: Run database integration tests
        env:
          DATABASE_TEST_OPERATOR_URL: postgres://postgres:postgres@127.0.0.1:54329/algocove
        run: pnpm test:integration

      - name: Build production application
        run: pnpm build

      - name: Install Chromium for accessibility tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser accessibility tests
        run: pnpm test:a11y

      - name: Audit dependencies
        run: pnpm security:audit
