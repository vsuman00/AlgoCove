name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Run repository verification
        run: pnpm verify

      - name: Install Chromium for integration and UI tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Start PostgreSQL and pgvector
        run: docker compose up -d --wait db

      - name: Run database integration tests
        env:
          DATABASE_TEST_OPERATOR_URL: postgres://postgres:postgres@127.0.0.1:54329/algocove
        run: pnpm test:integration

      - name: Build production application
        run: pnpm build

      - name: Run browser accessibility tests
        run: pnpm test:a11y

      - name: Run roadmap and offline recovery journeys
        run: pnpm test:e2e

      - name: Run execution result browser tests
        run: pnpm test:execution-browser

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Audit full dependency tree
        run: pnpm security:audit

      - name: Stop test PostgreSQL
        if: always()
        run: docker compose down -v

  execution-gates:
    name: Execution contract and sandbox gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Docker's GitHub-hosted image exporter cannot load an attestation
      # manifest list. The release workflow pushes the attested images.
      ALGO_COVE_IMAGE_ATTESTATIONS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml

      - name: Build pinned execution images
        run: pnpm images:build

      - name: Run execution-image smoke fixtures
        run: pnpm images:test

      - name: Run six-language semantic conformance
        run: pnpm test:conformance

      - name: Run bounded sandbox abuse fixtures
        run: pnpm test:sandbox

  stronger-sandbox:
    name: Stronger runtime sandbox spike
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install gVisor runsc
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'
          docker run --rm --runtime=runsc hello-world

      - name: Install dependencies for the real learning loop
        run: pnpm install --frozen-lockfile

      - name: Build reviewed execution images
        env:
          ALGO_COVE_IMAGE_ATTESTATIONS: "false"
        run: pnpm images:build

      - name: Build the production UI and install Chromium
        run: |
          pnpm build
          pnpm exec playwright install --with-deps chromium

      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait db

      - name: Test real six-language guided journeys and host recovery
        env:
          ALGO_COVE_REAL_LOOP_CI: "1"
          DATABASE_TEST_OPERATOR_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
        run: node scripts/test-real-learning-loop.ts

      - name: Upload real guided-loop evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: phase7-real-learning-loop
          path: .tmp/phase7-learning-loop-report.local.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Stop disposable PostgreSQL
        if: always()
        run: docker compose down -v

      - name: Run the candidate-runtime sandbox spike
        id: runtime-spike
        env:
          ALGO_COVE_DOCKER_RUNTIME: runsc
          ALGO_COVE_SANDBOX_REPORT: .tmp/task-19-gvisor-current.md
        run: pnpm test:sandbox:spike

      - name: Upload Task 19 runtime evidence
        if: always() && steps.runtime-spike.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: task-19-gvisor-evidence
          path: .tmp/task-19-gvisor-current.md
          include-hidden-files: true
          if-no-files-found: warn
