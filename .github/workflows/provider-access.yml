name: Vercel credential qualification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/provider-access.yml"
      - ".github/workflows/web-release.yml"
      - "ops/environments/vercel-hobby/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-access:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    environment: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Qualify the existing Hobby account without provisioning
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node ops/environments/vercel-hobby/preflight.ts
      - name: Check token against the intended project without deploying
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is unavailable in the bound GitHub environment." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            'https://api.vercel.com/v9/projects/prj_y4QC0yhk2h2frXDs8l3H0yn9IjJK?teamId=team_LGvZpIlcg4QXoGDvgCh1JX0v' > provider-project.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("provider-project.json","utf8")); if(p.id!=="prj_y4QC0yhk2h2frXDs8l3H0yn9IjJK" || p.name!=="algocove" || p.accountId!=="team_LGvZpIlcg4QXoGDvgCh1JX0v") throw Error("Unexpected Vercel project scope"); console.log(JSON.stringify({status:"provider_access_passed",project:p.name,projectId:p.id,teamId:p.accountId}));'
